[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Testes unitários (isolados, sem I/O real)
    integration: Testes de integração (múltiplos módulos)
    slow: Testes que demoram mais (ex: cálculos pesados)
addopts = -v --tb=short
