[pytest]
testpaths = tests_comissoes
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Testes unitários (rápidos, isolados)
    integration: Testes de integração (módulos combinados)
    e2e: Testes ponta a ponta (pipeline completo)
    fc: Testes relacionados ao Fator de Correção
    escada: Testes da regra de escada/rampa
    faturamento: Testes de comissão por faturamento
    recebimento: Testes de comissão por recebimento
    devolucao: Testes de devoluções/estornos
    cross_selling: Testes de cross-selling
    reconciliacao: Testes de reconciliação
